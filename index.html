<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Colorfly Studio</title>

    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <header>
        <h1>Colorfly Studio</h1>
        <p>"Generá una paleta de colores aleatoria para tus proyectos con solo 1 click".</p>
    </header>

    <main>

        <section id="paleta">
        </section>

    <div class="menu-paleta">

    <button id="generar-paleta">
        Generar paleta ▼
    </button>

    <div id="opciones-paleta">
           <button class="opcion" data-cantidad="6">
        6 colores
    </button>

    <button class="opcion" data-cantidad="8">
        8 colores
    </button>

    <button class="opcion" data-cantidad="9">
        9 colores
    </button>
    </div>

</div>

    </main>

    <footer>
        <p><strong>Colorfly Studio</strong></p>
    </footer>

    <script src="/scripts.js"></script>

</body>

</html>
